name: Publish fork Homebrew build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build macOS Intel release archive
        env:
          GOOS: darwin
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          mkdir -p dist/tunnel-client
          go build -trimpath -buildvcs=false -ldflags "-s -w -X github.com/openai/tunnel-client/pkg/version.GitSHA=${GITHUB_SHA} -X github.com/openai/tunnel-client/pkg/version.Flavor=full" -o dist/tunnel-client/tunnel-client ./cmd/client
          cd dist/tunnel-client
          sha256sum tunnel-client > SHA256SUMS
          zip -9 ../tunnel-client-darwin-amd64.zip tunnel-client SHA256SUMS
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create fork-v0.0.17.1 dist/tunnel-client-darwin-amd64.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Fork build 0.0.17.1" \
            --notes "macOS Intel CLI build from the louisje/tunnel-client fork." \
            --prerelease
