name: Publish fork binaries

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *' # Daily 11:17 Asia/Taipei

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve upstream stable version
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh api repos/openai/tunnel-client/releases/latest --jq .tag_name)"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          git fetch --no-tags https://github.com/openai/tunnel-client.git "refs/tags/$tag"
          upstream_sha="$(git rev-parse "FETCH_HEAD^{commit}")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$upstream_sha" >> "$GITHUB_OUTPUT"
      - name: Merge upstream release into temporary build branch
        id: source
        env:
          VERSION: ${{ steps.upstream.outputs.tag }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "fork-build-${GITHUB_RUN_ID}"
          if ! git merge --no-edit "$UPSTREAM_SHA"; then
            echo "::error::Cannot safely merge upstream $VERSION into fork; manual conflict resolution required."
            git merge --abort || true
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check whether the fork release needs publishing
        id: check
        env:
          VERSION: ${{ steps.upstream.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          assets="$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null || true)"
          git fetch --no-tags origin "refs/tags/$VERSION" 2>/dev/null || true
          existing_tag_sha="$(git rev-parse -q --verify "refs/tags/$VERSION^{commit}" 2>/dev/null || true)"
          if [[ -n "$existing_tag_sha" && "$(git rev-parse "$existing_tag_sha^{tree}")" != "$(git rev-parse "${{ steps.source.outputs.sha }}^{tree}")" ]]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for name in tunnel-client-darwin-amd64.zip tunnel-client-linux-amd64.zip tunnel-client-linux-arm64.zip; do
            if ! grep -Fxq "$name" <<< "$assets"; then
              echo "needed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "needed=false" >> "$GITHUB_OUTPUT"
          echo "Release $VERSION already has all three archives; skipping."
      - name: Build fork release archives
        if: steps.check.outputs.needed == 'true'
        env:
          VERSION: ${{ steps.upstream.outputs.tag }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          mkdir -p dist

          for platform in darwin/amd64 linux/amd64 linux/arm64; do
            goos="${platform%/*}"
            goarch="${platform#*/}"
            archive="tunnel-client-${goos}-${goarch}.zip"
            stage="$(mktemp -d)"

            GOOS="$goos" GOARCH="$goarch" go build -trimpath -buildvcs=false \
              -ldflags "-s -w -X github.com/openai/tunnel-client/pkg/version.GitSHA=${{ steps.source.outputs.sha }} -X github.com/openai/tunnel-client/pkg/version.Flavor=full -X github.com/openai/tunnel-client/pkg/version.semanticVersion=${version}" \
              -o "$stage/tunnel-client" ./cmd/client

            (
              cd "$stage"
              sha256sum tunnel-client > SHA256SUMS
              zip -9 "$GITHUB_WORKSPACE/dist/$archive" tunnel-client SHA256SUMS
            )
            rm -rf "$stage"
          done
      - name: Align fork tag and publish release
        if: steps.check.outputs.needed == 'true'
        env:
          VERSION: ${{ steps.upstream.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git tag -f "${VERSION}" "${{ steps.source.outputs.sha }}"
          # This is the fork's tag, not openai/tunnel-client's tag.
          git push --force origin "refs/tags/${VERSION}"
          if gh release view "${VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${VERSION}" dist/tunnel-client-*.zip --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${VERSION}" dist/tunnel-client-*.zip \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "${VERSION}" \
              --notes "macOS Intel and Linux amd64/arm64 builds from the fork merged with upstream ${VERSION}. Source: ${{ steps.source.outputs.sha }}."
          fi
